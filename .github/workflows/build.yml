name: Build apps

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: node scripts/build-web.mjs

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Stage APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/SleepSensor.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: SleepSensor-android
          path: dist/SleepSensor.apk
          if-no-files-found: error

  ios:
    name: iOS IPA (unsigned)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: node scripts/build-web.mjs

      - name: Add iOS platform
        run: npx cap add ios

      - name: Patch Info.plist
        run: node scripts/prepare-ios.mjs

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: CocoaPods
        working-directory: ios/App
        run: pod install --repo-update

      - name: Build unsigned .app
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            clean build

      - name: Package .ipa
        working-directory: ios/App
        run: |
          APP="build/Build/Products/Release-iphoneos/App.app"
          if [ ! -d "$APP" ]; then echo "App.app not found:"; find build -name '*.app'; exit 1; fi
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" "Payload/App.app"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          zip -qry "$GITHUB_WORKSPACE/dist/SleepSensor-unsigned.ipa" Payload
          ls -la "$GITHUB_WORKSPACE/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: SleepSensor-ios-unsigned
          path: dist/SleepSensor-unsigned.ipa
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect
        run: |
          mkdir -p out
          find artifacts -type f \( -name '*.apk' -o -name '*.ipa' \) -exec cp {} out/ \;
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
