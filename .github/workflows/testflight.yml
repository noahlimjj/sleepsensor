name: iOS → TestFlight

# Builds, signs and uploads the iOS app to App Store Connect / TestFlight from
# a macOS runner. Requires the following GitHub repository secrets:
#   ASC_KEY_ID
#   ASC_ISSUER_ID
#   ASC_KEY_P8
#   BUILD_CERTIFICATE_BASE64
#   P12_PASSWORD
#   BUILD_PROVISION_PROFILE_BASE64
#
# Trigger manually from GitHub Actions ("Run workflow") or push a tag like v1.0.0.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  testflight:
    runs-on: macos-15
    env:
      TEAM_ID: 44BP374T6C
    steps:
      - name: Check the API key secrets
        env:
          K: ${{ secrets.ASC_KEY_ID }}
          I: ${{ secrets.ASC_ISSUER_ID }}
          P: ${{ secrets.ASC_KEY_P8 }}
          C: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          PP: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          if [ -z "$K" ] || [ -z "$I" ] || [ -z "$P" ] || [ -z "$C" ] || [ -z "$PP" ]; then
            echo "::error::Add ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, BUILD_CERTIFICATE_BASE64, and BUILD_PROVISION_PROFILE_BASE64 secrets."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Select Xcode 16 (iOS 18 SDK)
        run: |
          echo "Installed Xcode versions:"
          ls -d /Applications/Xcode*.app || true
          XCODE_16=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE_16" ]; then
            echo "Selecting $XCODE_16"
            sudo xcode-select -s "$XCODE_16/Contents/Developer"
          else
            echo "::warning::Xcode 16 not found, selecting highest available"
            LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
            sudo xcode-select -s "$LATEST/Contents/Developer"
          fi
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: node scripts/build-web.mjs

      - name: Patch Info.plist
        run: node scripts/prepare-ios.mjs

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: CocoaPods
        working-directory: ios/App
        run: pod install

      - name: Install Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: API key and build number
        env:
          P: ${{ secrets.ASC_KEY_P8 }}
          K: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$P" > "$RUNNER_TEMP/keys/AuthKey_$K.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$K.p8" >> "$GITHUB_ENV"

          BUILD_NUM=$((7 + GITHUB_RUN_NUMBER))
          echo "Setting CURRENT_PROJECT_VERSION to $BUILD_NUM"
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $BUILD_NUM;/" ios/App/App.xcodeproj/project.pbxproj

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>app.sleepsensor.monitor</key>
              <string>SleepSensor AppStore</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF

      - name: Archive (signed with the API key)
        working-directory: ios/App
        env:
          K: ${{ secrets.ASC_KEY_ID }}
          I: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$K" -authenticationKeyIssuerID "$I" \
            DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGN_STYLE=Automatic archive | tail -30

      - name: Upload to App Store Connect (TestFlight)
        working-directory: ios/App
        env:
          K: ${{ secrets.ASC_KEY_ID }}
          I: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$K" -authenticationKeyIssuerID "$I" | tail -30
          echo "Uploaded. It shows up in App Store Connect → TestFlight after processing (10–30 min)."
